[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfplslm"
version = "0.1.0"
description = "Persistent recurrent Russian LM research POC"
requires-python = ">=3.11"
dependencies = ["torch==2.6.0", "numpy==2.2.4", "sentencepiece==0.2.0", "datasets==3.5.0", "einops==0.8.1", "pyyaml==6.0.2", "psutil==7.0.0", "packaging==24.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
